<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Breathing Exercises</title>
  <meta name="description" content="Guided breathing with visuals, ambient zen sounds (with fade), and optional voice cues for inhale/hold/exhale." />
  <style>
    :root { --bg:#0b1020; --card:#12172a; --muted:#a9b0c7; --text:#e9ecf6; --accent:#6ae3ff; --accent-2:#9b8cff; --ring:rgba(106,227,255,.2); }
    *{box-sizing:border-box} html,body{height:100%}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Inter,Roboto,Arial;color:var(--text);
      background:radial-gradient(1200px 800px at 75% -10%, #1a1f38 0, var(--bg) 60%),
                 radial-gradient(1000px 600px at -10% 110%, #1a1f38 0, var(--bg) 60%), var(--bg)}
    header{padding:20px 24px;display:flex;align-items:center;justify-content:space-between}
    .brand{font-weight:700}
    .container{max-width:1024px;margin:0 auto;padding:12px 24px 40px;display:grid;grid-template-columns:1.2fr 1fr;gap:24px}
    @media (max-width:980px){.container{grid-template-columns:1fr}}
    .card{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:20px}
    .stage{padding:24px;display:grid;place-items:center;position:relative;overflow:hidden;min-height:420px}
    .circle-wrap{position:relative;width:clamp(220px,50vmin,420px);height:clamp(220px,50vmin,420px)}
    .breath-circle{position:absolute;inset:0;border-radius:50%;
      background:radial-gradient(60% 60% at 50% 40%,rgba(255,255,255,.25),rgba(255,255,255,0) 60%),
                 radial-gradient(100% 100% at 50% 120%,var(--accent-2),var(--accent));
      filter:drop-shadow(0 10px 30px rgba(0,0,0,.45));transform:scale(.72);
      transition:transform var(--phase-ms,1000ms) ease-in-out}
    .breath-circle.expand{transform:scale(1)} .breath-circle.shrink{transform:scale(.64)}
    .halo{position:absolute;inset:-6px;border-radius:50%;box-shadow:0 0 0 12px var(--ring);opacity:.8;transition:opacity 600ms ease}
    .prompt{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:6px;user-select:none}
    .prompt h1{font-size:clamp(26px,3.6vw,40px);margin:0} .prompt p{margin:0;color:var(--muted);font-size:14px}
    .bar{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);width:86%;height:8px;border-radius:999px;overflow:hidden;background:rgba(255,255,255,.08)}
    .bar>span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width 100ms linear}
    .controls{padding:18px;display:grid;gap:16px}
    .row{display:grid;gap:12px;align-items:center} .row.two{grid-template-columns:1fr 1fr}
    label{font-size:13px;color:var(--muted)}
    select,input[type=number],button{background:#0f1430;color:var(--text);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:10px 12px;font:inherit}
    button{cursor:pointer;font-weight:600} .button.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#08111a;border:none}
    .chip{display:inline-flex;align-items:center;gap:8px;padding:8px 10px;background:#0f1430;border:1px solid rgba(255,255,255,.1);border-radius:999px}
    footer{padding:12px 24px 30px;text-align:center;color:var(--muted);font-size:13px}
    .vol{width:100%}
  </style>
</head>
<body>
  <header>
    <div class="brand">🌿 Zen Breathe</div>
    <div style="opacity:.6;font-size:13px">Space to start/pause • F fullscreen</div>
  </header>

  <main class="container">
    <section class="card stage" aria-live="polite">
      <div class="circle-wrap" aria-hidden="true">
        <div class="breath-circle" id="circle"></div>
        <div class="halo" id="halo"></div>
      </div>
      <div class="prompt">
        <h1 id="cue">Ready</h1>
        <p id="subcue">Pick a pattern, choose a sound, and press Start</p>
      </div>
      <div class="bar" aria-hidden="true"><span id="progress"></span></div>
    </section>

    <aside class="card">
      <div class="controls">
        <div class="row two">
          <div>
            <div class="row two">
            <div>
                <label for="lang">Language</label>
                <select id="lang">
                <option value="en">English</option>
                <option value="nl">Nederlands</option>
                </select>
            </div>
            </div>
            <label for="pattern">Pattern</label>
            <select id="pattern">
              <option value="box">Box (4–4–4–4)</option>
              <option value="478">4–7–8</option>
              <option value="coherent">Coherent (5–5)</option>
              <option value="triangle">Triangle (4–4–4)</option>
            </select>
          </div>
          <div>
            <label for="minutes">Session length (min)</label>
            <input id="minutes" type="number" min="1" max="60" value="5" />
          </div>
        </div>

        <div class="row">
          <div>
            <label for="sound">Ambient sound</label>
            <select id="sound">
              <option value="none">None</option>
              <option value="forest">Forest</option>
              <option value="wind">Wind</option>
              <option value="thunder">Thunderstorm</option>
              <option value="water">Water Flow</option>
              <option value="custom">Custom URL…</option>
            </select>
          </div>
        </div>

        <div class="row" id="customUrlRow" style="display:none">
          <div>
            <label for="customUrl">Custom audio URL</label>
            <input id="customUrl" type="url" placeholder="https://example.com/ambient.mp3" />
          </div>
        </div>

        <div class="row"><div id="audioStatus" style="font-size:12px;color:#a9b0c7"></div></div>

        <div class="row two">
          <div>
            <label for="volume">Ambient volume</label>
            <input id="volume" class="vol" type="range" min="0" max="1" step="0.01" value="0.3" />
          </div>
          <div class="chip"><input id="voiceToggle" type="checkbox"/> <span>Voice cues (inhale/hold/exhale)</span></div>
        </div>

        <div class="row" id="voiceVolumeRow" style="display:none">
          <div>
            <label for="voiceVolume">Voice cue volume</label>
            <input id="voiceVolume" class="vol" type="range" min="0" max="1" step="0.05" value="0.9" />
          </div>
        </div>

        <div class="row two">
          <button id="startBtn" class="primary">Start</button>
          <button id="resetBtn">Reset</button>
        </div>
      </div>
    </aside>
  </main>

  <footer>Calm breathing with ambient fades and optional voice guidance.</footer>
  <script src="breathing.js"></script>
</body>
</html>
